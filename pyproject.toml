[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "huggingface-project-utils"
version = "0.1.0"
authors = [{ name = "KAFKA2306" }]
description = "Revision-pinned Hugging Face shared-cache utilities."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch",
  "diffusers @ git+https://github.com/huggingface/diffusers",
  "transformers",
  "huggingface-hub",
  "PyYAML>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/KAFKA2306/hf-cache-hub"
"Bug Tracker" = "https://github.com/KAFKA2306/hf-cache-hub/issues"

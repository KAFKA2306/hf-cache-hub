name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7" "huggingface-hub>=1.0,<2" "filelock>=3.0"
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Unit and acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Validate model registry
        run: python scripts/validate_models.py models.yaml --report build/model-registry-audit.json
      - name: Validate artifact manifest
        run: python scripts/artifact_manager.py --manifest artifacts.yaml validate
      - name: Validate cache plan without downloading
        run: python scripts/cache_manager.py plan
      - name: Validate service funnel ledger
        run: |
          python scripts/service_funnel.py validate
          python scripts/service_funnel.py summary
      - name: Upload model registry audit
        uses: actions/upload-artifact@v6
        with:
          name: model-registry-audit
          path: build/model-registry-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify clean checkout
        if: always()
        run: |
          rm -rf build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=all)"

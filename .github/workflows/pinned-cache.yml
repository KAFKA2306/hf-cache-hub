name: Pinned cache contract

on:
  pull_request:
    paths:
      - "models.yaml"
      - "Taskfile.yaml"
      - "scripts/cache_manager.py"
      - "scripts/service_funnel.py"
      - "tests/test_cache_manager.py"
      - "tests/test_service_prospects.py"
      - "tests/test_service_funnel.py"
      - "data/team-cache-prospects.json"
      - "data/service-funnel.json"
      - "docs/services/team-cache-bootstrap.md"
      - ".github/workflows/pinned-cache.yml"
  push:
    branches: [main]
    paths:
      - "models.yaml"
      - "Taskfile.yaml"
      - "scripts/cache_manager.py"
      - "scripts/service_funnel.py"
      - "tests/test_cache_manager.py"
      - "tests/test_service_prospects.py"
      - "tests/test_service_funnel.py"
      - "data/team-cache-prospects.json"
      - "data/service-funnel.json"
      - "docs/services/team-cache-bootstrap.md"
      - ".github/workflows/pinned-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7" "huggingface-hub>=1.0,<2"
      - name: Compile
        run: >-
          python -m py_compile
          scripts/cache_manager.py
          scripts/service_funnel.py
          tests/test_cache_manager.py
          tests/test_service_prospects.py
          tests/test_service_funnel.py
      - name: Unit and acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Validate production registry without downloading
        run: python scripts/cache_manager.py plan
      - name: Validate privacy-safe service funnel ledger
        run: |
          python scripts/service_funnel.py validate
          python scripts/service_funnel.py summary
      - name: Verify clean checkout
        if: always()
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=all)"

version: "3"

vars:
  HF_HOME: '{{coalesce (env "HF_HOME") (print (env "HOME") "/hf-cache")}}'
  HF_HUB_CACHE: '{{coalesce (env "HF_HUB_CACHE") (print .HF_HOME "/hub")}}'

tasks:
  hf:plan:
    desc: "Plan revision-pinned model cache sync without downloading"
    env:
      HF_HOME: '{{.HF_HOME}}'
      HF_HUB_CACHE: '{{.HF_HUB_CACHE}}'
    cmds:
      - uv run python scripts/cache_manager.py plan

  hf:sync:
    desc: "Download pinned revisions, link exact snapshots, and write cache-manifest.json"
    env:
      HF_HOME: '{{.HF_HOME}}'
      HF_HUB_CACHE: '{{.HF_HUB_CACHE}}'
    cmds:
      - uv run python scripts/cache_manager.py sync

  hf:auto-download:
    desc: "Compatibility alias: synchronize pinned models"
    cmds:
      - task: hf:sync

  hf:auto-link:
    desc: "Compatibility alias: synchronize pinned models and exact links"
    cmds:
      - task: hf:sync

  hf:ls:
    desc: "List Hugging Face cache revisions"
    env:
      HF_HOME: '{{.HF_HOME}}'
      HF_HUB_CACHE: '{{.HF_HUB_CACHE}}'
    cmds:
      - uvx hf cache ls --revisions --format table

  hf:prune:
    desc: "Prune unreferenced cache revisions"
    env:
      HF_HOME: '{{.HF_HOME}}'
      HF_HUB_CACHE: '{{.HF_HUB_CACHE}}'
    cmds:
      - uvx hf cache prune --dry-run
      - uvx hf cache prune --yes

  hf:clean-links:
    desc: "Remove broken project symlinks"
    cmds:
      - mkdir -p models
      - find models -xtype l -delete

  artifact:validate:
    desc: "Validate the generated-artifact manifest"
    cmds:
      - uv run python scripts/artifact_manager.py validate

  artifact:publish:
    desc: "Publish one declared artifact and verify remote readback; pass PATH --id ID after --"
    cmds:
      - uv run python scripts/artifact_manager.py publish {{.CLI_ARGS}}

  artifact:plan:
    desc: "Report HIT, MISS, or CORRUPT for declared artifacts in the shared cache"
    env:
      HF_HOME: '{{.HF_HOME}}'
    cmds:
      - uv run python scripts/artifact_cache.py plan {{.CLI_ARGS}}

  artifact:resolve:
    desc: "Resolve one declared artifact by SHA-256 into the shared cache; pass --id ID after --"
    env:
      HF_HOME: '{{.HF_HOME}}'
    cmds:
      - uv run python scripts/artifact_cache.py resolve {{.CLI_ARGS}}

  video:generate:
    desc: "Generate video from a pinned local model snapshot; pass args after --"
    cmds:
      - uv run python scripts/generate_video.py {{.CLI_ARGS}}

  service:funnel-audit:
    desc: "Validate the privacy-safe service funnel ledger and show observed evidence counts"
    cmds:
      - uv run python scripts/service_funnel.py validate
      - uv run python scripts/service_funnel.py summary
